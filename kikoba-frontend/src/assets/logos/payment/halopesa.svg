<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- Background -->
    <rect width="200" height="200" rx="20" fill="#F26522"/>

    <!-- Circular dot icon (left of "halo") -->
    <circle cx="48" cy="72" r="14" fill="#FFFFFF"/>
    <path d="M 68 58
           C 74 58 78 62 78 68
           C 78 72 74 76 68 76
           C 78 76 82 82 82 88
           C 82 92 78 96 72 96
           C 62 96 58 88 58 78
           C 58 66 62 58 68 58 Z"
          fill="#FFFFFF" opacity="0.5"/>

    <!-- "halo" text -->
    <text x="130" y="92"
          font-family="Arial, Helvetica, sans-serif"
          font-size="52"
          font-weight="900"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-3">halo</text>

    <!-- "pesa" outlined rounded rectangle -->
    <rect x="30" y="110" width="140" height="60" rx="12"
          fill="none" stroke="#FFFFFF" stroke-width="4"/>

    <!-- "pesa" text inside -->
    <text x="100" y="152"
          font-family="Arial, Helvetica, sans-serif"
          font-size="42"
          font-weight="900"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="-2">pesa</text>
</svg>