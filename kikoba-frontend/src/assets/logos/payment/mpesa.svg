<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <!-- White background with subtle border -->
    <rect width="200" height="200" rx="20" fill="#FFFFFF"/>
    <rect x="1" y="1" width="198" height="198" rx="20" fill="none" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Left: Vodacom circle logo (simplified) -->
    <g transform="translate(50, 95)">
        <!-- Outer red circle with speech-bubble cut -->
        <path d="M 0 -38
             C 21 -38 38 -21 38 0
             C 38 21 21 38 0 38
             C -21 38 -38 21 -38 0
             C -38 -10 -32 -22 -22 -30
             C -18 -33 -14 -35 -8 -36
             C -6 -30 -4 -25 0 -25
             C 4 -25 6 -30 8 -36
             C 14 -35 18 -33 22 -30
             C 22 -18 16 -8 8 -4
             C 2 -1 -2 -6 -6 -14
             C -10 -20 -14 -22 -18 -18
             C -22 -14 -22 -6 -18 0
             C -14 8 -6 14 4 14
             C 16 14 28 6 28 -6
             C 28 -22 16 -34 0 -38 Z"
              fill="#E60000"/>
        <!-- Inner white area for the leaf effect -->
        <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
        <path d="M -14 -2
             C -10 -10 0 -14 8 -12
             C 6 -6 0 0 -8 2
             C -10 4 -12 6 -14 4
             Z"
              fill="#E60000"/>
    </g>

    <!-- Vertical divider line -->
    <line x1="100" y1="55" x2="100" y2="145" stroke="#E5E7EB" stroke-width="1.5"/>

    <!-- Right: M-Pesa mark — phone with leaf -->
    <g transform="translate(140, 95)">
        <!-- Phone outline -->
        <rect x="-18" y="-30" width="36" height="60" rx="5"
              fill="none" stroke="#E60000" stroke-width="3.5"/>
        <!-- Home button dot -->
        <circle cx="0" cy="24" r="2" fill="#E60000"/>
        <!-- Screen line -->
        <line x1="-14" y1="-22" x2="14" y2="-22" stroke="#E60000" stroke-width="2"/>

        <!-- Green leaf (overlapping the phone) -->
        <path d="M -6 -6
             C -2 -14 8 -16 16 -10
             C 12 -2 2 2 -6 -2
             C -6 -4 -6 -5 -6 -6 Z"
              fill="#4CAF50"/>
        <path d="M -2 -8
             C 2 -12 10 -12 14 -8
             L 8 -6
             C 6 -8 2 -8 -2 -8 Z"
              fill="#388E3C"/>
    </g>

    <!-- "m-pesa" text -->
    <text x="100" y="180"
          font-family="Arial, Helvetica, sans-serif"
          font-size="30"
          font-weight="900"
          fill="#E60000"
          text-anchor="middle"
          letter-spacing="-1">m-pesa</text>
</svg>